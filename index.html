<!DOCTYPE html>
<html>
<head>
    	<meta charset="utf-8" />
    	<meta name="viewport" content="width=device-width" />
	<title>Kde widget</title>
	<script src="script.js" defer></script>
	<link href="styles/style.css" rel="stylesheet" />
</head>
<body>
<header>
	<h1>Задачи</h1>
</header>
<main>
	<div class="container">

		<section>
			<h2>Короткие</h2>
			<ul class="shortTasks">
				<li>technologists</li>
				<li>thinkers</li>
 				<li>builders</li>
			</ul>
			<form class="shortForm">

		</section>
		<section>
		<h2>Длинные</h2>
		<ul class="longTasks">
			<li>technologists</li>
			<li>thinkers</li>
 			<li>builders</li>
		</ul>
			<form class="longForm">
				<input type="text" class="inpLong">

			</form>
		</section>
	</div>
</main>
</body>
</html>
